<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYA OS Dashboard</title>
    <!-- Use a modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="dashboard-container">
        
        <!-- Sidebar / Status Panel -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <div class="brand-logo">
                    <div class="pulse-ring"></div>
                    <div class="core-dot"></div>
                </div>
                <h2>MAYA <span>OS</span></h2>
            </div>
            
            <div class="status-section">
                <h3>System Status</h3>
                <ul>
                    <li><span class="status-indicator online"></span> Core Engine: Online</li>
                    <li><span class="status-indicator online"></span> OmniRoute: Connected</li>
                    <li><span class="status-indicator warning"></span> Tools: 1 Loaded</li>
                </ul>
            </div>

            <div class="status-section">
                <h3>Agent Activity</h3>
                <div id="activity-log" class="activity-log">
                    <div class="activity-item">System initialized...</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area glass-panel">
            <header class="chat-header">
                <h2>Terminal <span class="badge">v0.1.0-alpha</span></h2>
                <div class="model-badge">Using OmniRoute / Gemini</div>
            </header>
            
            <div id="chat-history" class="chat-history">
                <!-- Initial greeting -->
                <div class="message maya-message">
                    <div class="message-content">
                        Hello Anshuman. The MAYA reasoning engine is online. How can I help you today?
                    </div>
                </div>
            </div>

            <div class="input-container">
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Type a command for MAYA..." autocomplete="off">
                    <button type="submit" id="send-button">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </main>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
